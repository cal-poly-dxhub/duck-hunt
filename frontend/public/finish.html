<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2aa7c4" />
<title>You Made It! 🦆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #3fb6d3;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    /* Calm cool gradient — friendly, not "champion gold" */
    background: linear-gradient(135deg, #6fd0e6, #3fb6d3, #2e8fb8, #5bc6dd, #43b0d6);
    background-size: 400% 400%;
    animation: bgShift 14s ease infinite;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 5vh;
    opacity: 0;
    transform: translateY(24px);
    animation: rise 0.7s ease-out 0.15s forwards;
  }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(24px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Duck (no crown; a happy medal instead) ---------- */
  .duck-wrap {
    width: min(52vw, 240px);
    animation: bob 1.6s ease-in-out infinite;
    transform-origin: 50% 90%;
    filter: drop-shadow(0 16px 20px rgba(0, 60, 80, 0.3));
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0)    rotate(-3deg); }
    50%      { transform: translateY(-16px) rotate(3deg); }
  }
  .duck-shadow {
    width: min(38vw, 175px);
    height: 20px;
    margin-top: 8px;
    background: rgba(0, 50, 70, 0.25);
    border-radius: 50%;
    filter: blur(4px);
    animation: shadowPulse 1.6s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scaleX(1);   opacity: 0.25; }
    50%      { transform: scaleX(0.85); opacity: 0.16; }
  }
  .sparkle { animation: twinkle 2s ease-in-out infinite; transform-origin: center; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; transform: scale(0.8); }
    50%      { opacity: 1;    transform: scale(1.1); }
  }

  /* ---------- Text ---------- */
  .headline {
    font-size: clamp(40px, 12vw, 90px);
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.0;
    color: #ffffff;
    text-shadow: 0 3px 0 rgba(0, 80, 110, 0.35), 0 6px 16px rgba(0, 60, 90, 0.3);
    animation: popIn 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) both;
  }
  @keyframes popIn {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }
  .subtitle {
    margin-top: 2.2vh;
    font-size: clamp(16px, 4.6vw, 24px);
    font-weight: 800;
    color: #06485e;
    background: rgba(255, 255, 255, 0.7);
    padding: 10px 22px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    animation: fadeUp 0.8s ease-out 0.5s both;
  }
  .cheer {
    margin-top: 1.4vh;
    font-size: clamp(14px, 3.8vw, 18px);
    font-weight: 700;
    color: rgba(255, 255, 255, 0.95);
    animation: fadeUp 0.8s ease-out 0.7s both;
  }
  @keyframes fadeUp {
    0%   { transform: translateY(18px); opacity: 0; }
    100% { transform: translateY(0);    opacity: 1; }
  }
</style>
</head>
<body>
  <!-- Tap-to-celebrate overlay: prompts to raise volume AND provides the user
       gesture mobile browsers require to unblock the finish sound. -->
  <div id="volume-prompt" style="
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: rgba(0,0,0,0.82); backdrop-filter: blur(3px);
    cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;">
    <div style="font-size: clamp(48px, 18vw, 96px); line-height: 1;">🔊</div>
    <div style="font-size: clamp(22px, 6vw, 34px); font-weight: 800; margin-top: 16px;">
      Turn up your volume!
    </div>
    <div style="font-size: clamp(15px, 4.5vw, 20px); margin-top: 10px; opacity: 0.85;">
      Then tap anywhere to celebrate 🎉
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <div class="stage">
    <div>
      <div class="duck-wrap">
        <svg viewBox="0 0 220 220" width="100%" xmlns="http://www.w3.org/2000/svg" aria-label="Happy duck">
          <!-- Sparkles around the duck -->
          <g fill="#fff">
            <path class="sparkle" style="animation-delay:0s"   d="M40 60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
            <path class="sparkle" style="animation-delay:0.6s" d="M180 50 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
            <path class="sparkle" style="animation-delay:1.1s" d="M172 130 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
          </g>
          <!-- Body -->
          <ellipse cx="112" cy="150" rx="66" ry="52" fill="#ffd400"/>
          <!-- Head -->
          <circle cx="92" cy="104" r="40" fill="#ffdd1f"/>
          <!-- Wing (waving) -->
          <path d="M112 138 q40 -6 52 20 q-26 20 -52 6 Z" fill="#f4c000"/>
          <!-- Medal on the chest -->
          <circle cx="112" cy="168" r="15" fill="#e8f6fb" stroke="#2aa7c4" stroke-width="3"/>
          <circle cx="112" cy="168" r="7" fill="#8fd8ec"/>
          <!-- Eye (happy) -->
          <circle cx="82" cy="98" r="7" fill="#3a2a00"/>
          <circle cx="84" cy="95.5" r="2.4" fill="#fff"/>
          <!-- Beak (smiling open) -->
          <path d="M44 104 q-24 6 -2 20 q16 6 26 -6 Z" fill="#ff8a1e" stroke="#e06f00" stroke-width="2"/>
          <!-- Feet -->
          <path d="M96 198 l-14 14 M118 200 l4 18" stroke="#ff8a1e" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="duck-shadow"></div>
    </div>

    <div>
      <div class="headline">GREAT&nbsp;JOB!</div>
      <div class="subtitle">🦆 You made it to the end of the hunt!</div>
      <div class="cheer">Thanks for playing — you caught 'em all! 🎉</div>
    </div>
  </div>

<script>
(function () {
  // ---------- Gentle confetti (lighter than the winner screen) ----------
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize);

  const COLORS = ['#ffffff', '#ffe27a', '#8fd8ec', '#5bc6dd', '#a8e6a1', '#ffd400'];
  const pieces = [];

  function spawn(n) {
    for (let i = 0; i < n; i++) {
      pieces.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.4,
        r: (3 + Math.random() * 6) * dpr,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        vx: (Math.random() - 0.5) * 2 * dpr,
        vy: (1.5 + Math.random() * 3) * dpr,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.25,
        shape: Math.random() < 0.5 ? 'rect' : 'circ',
        wob: Math.random() * Math.PI * 2
      });
    }
  }

  spawn(70);
  setInterval(() => { if (pieces.length < 160) spawn(16); }, 800);

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.wob += 0.04;
      p.x += p.vx + Math.sin(p.wob) * 0.5 * dpr;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r / 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      if (p.y > H + 40) pieces.splice(i, 1);
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ---------- Soft haptic pat-on-the-back ----------
  if (navigator.vibrate) {
    try { navigator.vibrate([40, 60, 40]); } catch (e) {}
  }

  // ---------- Duck quack (loops, starts on first interaction) ----------
  // Sound source: pixabay.com (royalty-free).
  const clip = new Audio('win-sound.mp3');
  clip.loop = true;
  clip.preload = 'auto';
  clip.volume = 0.7;

  let started = false;
  function startAudio() {
    if (started) return;
    clip.currentTime = 0;
    const p = clip.play();
    if (p && p.then) {
      p.then(() => { started = true; }).catch(() => {});
    } else {
      started = true;
    }
  }
  startAudio();
  ['touchstart', 'click', 'pointerdown', 'keydown'].forEach(function (ev) {
    addEventListener(ev, startAudio, { once: false });
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) startAudio();
  });

  // ---------- Tap-to-celebrate overlay ----------
  // Tapping it counts as the user gesture that unblocks audio, then fades out.
  const prompt = document.getElementById('volume-prompt');
  if (prompt) {
    function dismissPrompt() {
      startAudio();
      prompt.style.transition = 'opacity 0.4s ease';
      prompt.style.opacity = '0';
      setTimeout(function () { prompt.style.display = 'none'; }, 400);
    }
    prompt.addEventListener('click', dismissPrompt, { once: true });
    prompt.addEventListener('touchstart', dismissPrompt, { once: true });
  }
})();
</script>
</body>
</html>
