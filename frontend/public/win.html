<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f6a800" />
<title>You Won! 🦆👑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffcf4a;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    /* Animated warm gradient background */
    background: linear-gradient(135deg, #ffd93b, #ffb01f, #ff8a3d, #ffd93b, #ffca28);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Confetti sits above the gradient, behind the content */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6vh;
    /* Hidden until the explosion "reveals" it */
    opacity: 0;
    transform: scale(0.3);
    animation: reveal 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
    animation-delay: 0.55s;
  }
  @keyframes reveal {
    0%   { opacity: 0; transform: scale(0.3); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ---------- Explosion intro ---------- */
  /* White flash that blasts then fades */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: radial-gradient(circle at center, #ffffff 0%, #fff2b0 40%, rgba(255,255,255,0) 75%);
    pointer-events: none;
    animation: flash 0.7s ease-out forwards;
  }
  @keyframes flash {
    0%   { opacity: 0;   transform: scale(0.2); }
    12%  { opacity: 1;   transform: scale(1.1); }
    100% { opacity: 0;   transform: scale(1.4); }
  }
  /* Expanding shockwave ring */
  #shockwave {
    position: fixed;
    top: 50%; left: 50%;
    z-index: 4;
    width: 40px; height: 40px;
    margin: -20px 0 0 -20px;
    border-radius: 50%;
    border: 10px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 40px 10px rgba(255, 210, 90, 0.8);
    pointer-events: none;
    animation: shock 0.7s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
  }
  @keyframes shock {
    0%   { opacity: 0.9; transform: scale(0.1); border-width: 14px; }
    100% { opacity: 0;   transform: scale(22);  border-width: 0px; }
  }

  /* ---------- Duck ---------- */
  .duck-wrap {
    width: min(56vw, 260px);
    animation: dance 1.1s ease-in-out infinite;
    transform-origin: 50% 90%;
    filter: drop-shadow(0 18px 22px rgba(150, 80, 0, 0.35));
  }
  @keyframes dance {
    0%   { transform: translateY(0)     rotate(-6deg); }
    25%  { transform: translateY(-22px) rotate(4deg); }
    50%  { transform: translateY(0)     rotate(6deg); }
    75%  { transform: translateY(-14px) rotate(-4deg); }
    100% { transform: translateY(0)     rotate(-6deg); }
  }
  /* little shadow that pulses under the duck */
  .duck-shadow {
    width: min(40vw, 190px);
    height: 22px;
    margin-top: 8px;
    background: rgba(120, 60, 0, 0.28);
    border-radius: 50%;
    filter: blur(4px);
    animation: shadowPulse 1.1s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 50%, 100% { transform: scaleX(1);    opacity: 0.28; }
    25%           { transform: scaleX(0.8);  opacity: 0.18; }
    75%           { transform: scaleX(0.9);  opacity: 0.22; }
  }
  .crown { transform-origin: 50% 100%; animation: crownTilt 1.1s ease-in-out infinite; }
  @keyframes crownTilt {
    0%,100% { transform: rotate(-3deg); }
    50%     { transform: rotate(3deg); }
  }

  /* ---------- Text ---------- */
  .headline {
    font-size: clamp(48px, 16vw, 120px);
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 0.95;
    background: linear-gradient(180deg, #fff6d5 0%, #ffd84d 45%, #ff9a1f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 3px 0 rgba(180, 90, 0, 0.25);
    -webkit-text-stroke: 2px #b5560a;
    animation: popIn 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) both, glow 1.8s ease-in-out infinite 0.7s;
  }
  @keyframes popIn {
    0%   { transform: scale(0.2) rotate(-8deg); opacity: 0; }
    100% { transform: scale(1)   rotate(0deg);  opacity: 1; }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 220, 120, 0.6)); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 24px rgba(255, 220, 120, 1));  transform: scale(1.04); }
  }
  .subtitle {
    margin-top: 2.4vh;
    font-size: clamp(16px, 4.6vw, 24px);
    font-weight: 800;
    color: #6e3200;
    background: rgba(255, 255, 255, 0.55);
    padding: 10px 20px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    animation: fadeUp 0.8s ease-out 0.5s both;
  }
  @keyframes fadeUp {
    0%   { transform: translateY(20px); opacity: 0; }
    100% { transform: translateY(0);    opacity: 1; }
  }
</style>
</head>
<body>
  <!-- Tap-to-celebrate overlay: prompts to raise volume AND provides the user
       gesture mobile browsers require to unblock the win sound. -->
  <div id="volume-prompt" style="
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: rgba(0,0,0,0.82); backdrop-filter: blur(3px);
    cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;">
    <div style="font-size: clamp(48px, 18vw, 96px); line-height: 1;">🔊</div>
    <div style="font-size: clamp(22px, 6vw, 34px); font-weight: 800; margin-top: 16px;">
      Turn up your volume!
    </div>
    <div style="font-size: clamp(15px, 4.5vw, 20px); margin-top: 10px; opacity: 0.85;">
      Then tap anywhere to celebrate 🎉
    </div>
  </div>

  <canvas id="confetti"></canvas>
  <div id="shockwave"></div>
  <div id="flash"></div>

  <div class="stage">
    <div>
      <!-- Duck (crowned) -->
      <div class="duck-wrap">
        <svg viewBox="0 0 220 220" width="100%" xmlns="http://www.w3.org/2000/svg" aria-label="Champion duck">
          <!-- Crown -->
          <g class="crown">
            <path d="M70 44 L86 66 L110 40 L134 66 L150 44 L146 78 L74 78 Z"
                  fill="#ffce2e" stroke="#c98a00" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="70" cy="44" r="6" fill="#ff5d5d"/>
            <circle cx="110" cy="38" r="6" fill="#5db0ff"/>
            <circle cx="150" cy="44" r="6" fill="#5dff8f"/>
          </g>
          <!-- Body -->
          <ellipse cx="112" cy="150" rx="66" ry="52" fill="#ffd400"/>
          <!-- Head -->
          <circle cx="92" cy="104" r="40" fill="#ffdd1f"/>
          <!-- Wing -->
          <path d="M112 138 q40 -6 52 20 q-26 20 -52 6 Z" fill="#f4c000"/>
          <!-- Eye -->
          <circle cx="82" cy="98" r="7" fill="#3a2a00"/>
          <circle cx="84" cy="95.5" r="2.4" fill="#fff"/>
          <!-- Beak -->
          <path d="M44 104 q-24 6 -2 20 q16 6 26 -6 Z" fill="#ff8a1e" stroke="#e06f00" stroke-width="2"/>
          <!-- Feet hint -->
          <path d="M96 198 l-14 14 M118 200 l4 18" stroke="#ff8a1e" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="duck-shadow"></div>
    </div>

    <div>
      <div class="headline">YOU&nbsp;WON!</div>
      <div class="subtitle">🦆 First team to catch the final duck! 👑</div>
    </div>
  </div>

<script>
(function () {
  // ---------- Confetti ----------
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize);

  const COLORS = ['#ff5d5d', '#ffcf3a', '#5db0ff', '#5dff8f', '#ff9a3d', '#c56bff', '#ffffff'];
  const pieces = [];

  // Gentle falling confetti (steady rain from the top).
  function spawn(n) {
    for (let i = 0; i < n; i++) {
      pieces.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.4,
        r: (4 + Math.random() * 7) * dpr,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        vx: (Math.random() - 0.5) * 3 * dpr,
        vy: (2 + Math.random() * 4) * dpr,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        shape: Math.random() < 0.5 ? 'rect' : 'circ',
        wob: Math.random() * Math.PI * 2,
        grav: 0,          // rain has its own constant fall; no extra gravity
        drag: 1
      });
    }
  }

  // BIG explosion: fling particles radially outward from the center, then let
  // gravity pull them down (firework-style).
  function explode(n) {
    const cx = W / 2, cy = H / 2;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const speed = (6 + Math.random() * 16) * dpr;   // strong outward blast
      pieces.push({
        x: cx, y: cy,
        r: (4 + Math.random() * 8) * dpr,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.5,
        shape: Math.random() < 0.5 ? 'rect' : 'circ',
        wob: Math.random() * Math.PI * 2,
        grav: 0.28 * dpr,   // pulled down after the blast
        drag: 0.97          // air resistance so the blast slows
      });
    }
  }

  // 💥 Kick off with a massive central explosion...
  explode(260);
  // ...then start the steady rain shortly after, once the blast settles.
  setTimeout(() => {
    spawn(120);
    setInterval(() => { if (pieces.length < 340) spawn(30); }, 700);
  }, 650);

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.wob += 0.05;
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.grav;   // gravity for blast particles
      p.x += p.vx + Math.sin(p.wob) * 0.6 * dpr;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r / 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      // Remove once well off any edge.
      if (p.y > H + 60 || p.x < -80 || p.x > W + 80) pieces.splice(i, 1);
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ---------- Haptics: a big "BOOM" buzz to match the explosion ----------
  if (navigator.vibrate) {
    try { navigator.vibrate([200, 60, 40, 40, 40, 40, 120]); } catch (e) {}
  }

  // ---------- Duck quacks + celebratory chime (WebAudio, no files) ----------
  // Autoplay audio is blocked until a user gesture on most phones, so we
  // play it on the first tap/touch anywhere.
  let ac = null;
  function ctxGet() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ac) ac = new AC();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  // Synthesize one quack: a buzzy sawtooth pushed through a sweeping
  // bandpass "formant" filter, with a quick pitch rise-then-fall and a
  // short amplitude burst. Sounds convincingly duck-like.
  function quack(startAt, pitch) {
    pitch = pitch || 1;
    const osc = ac.createOscillator();
    const bp = ac.createBiquadFilter();
    const gain = ac.createGain();
    osc.type = 'sawtooth';
    bp.type = 'bandpass';
    bp.Q.value = 6;

    const t = startAt;
    const dur = 0.19;
    // Pitch: quick rise then fall — the classic quack contour.
    osc.frequency.setValueAtTime(280 * pitch, t);
    osc.frequency.linearRampToValueAtTime(720 * pitch, t + 0.05);
    osc.frequency.linearRampToValueAtTime(360 * pitch, t + dur);
    // Formant sweep on the bandpass gives it the nasal "quack" timbre.
    bp.frequency.setValueAtTime(900 * pitch, t);
    bp.frequency.linearRampToValueAtTime(1700 * pitch, t + 0.05);
    bp.frequency.linearRampToValueAtTime(800 * pitch, t + dur);
    // Amplitude: sharp attack, quick decay.
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.5, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(bp); bp.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }

  // A longer, sillier duck routine (~5s): a giggly stutter of quacks that
  // speeds up, a dramatic pause, one HUGE low "victory honk" quack, then a
  // sparkly fanfare. Meant to be goofy.
  function synthRoutine() {
    if (!ctxGet()) return;
    const now = ac.currentTime;
    let t = now;

    // 1) Chattering quacks that accelerate and rise in pitch (the "giggle").
    let gap = 0.26;
    let pitch = 0.9;
    for (let i = 0; i < 8; i++) {
      quack(t, pitch);
      t += gap;
      gap *= 0.82;      // speeds up
      pitch *= 1.05;    // creeps higher — sounds increasingly excited
    }

    // 2) Comedic pause.
    t += 0.45;

    // 3) One big, low, dramatic "victory honk" quack (slower + deeper).
    (function honk(startAt) {
      const osc = ac.createOscillator();
      const bp = ac.createBiquadFilter();
      const gain = ac.createGain();
      osc.type = 'sawtooth';
      bp.type = 'bandpass'; bp.Q.value = 5;
      const dur = 0.75;
      osc.frequency.setValueAtTime(180, startAt);
      osc.frequency.linearRampToValueAtTime(300, startAt + 0.15);
      osc.frequency.linearRampToValueAtTime(150, startAt + dur);
      bp.frequency.setValueAtTime(600, startAt);
      bp.frequency.linearRampToValueAtTime(1200, startAt + 0.15);
      bp.frequency.linearRampToValueAtTime(500, startAt + dur);
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(0.6, startAt + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
      osc.connect(bp); bp.connect(gain); gain.connect(ac.destination);
      osc.start(startAt); osc.stop(startAt + dur + 0.05);
    })(t);
    t += 0.9;

    // 4) Sparkly triumphant fanfare chime to finish.
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5]; // C E G C E
    notes.forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      o.connect(g); g.connect(ac.destination);
      const tt = t + i * 0.12;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.22, tt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.4);
      o.start(tt); o.stop(tt + 0.45);
    });
  }

  // ---------- Duck quack audio: loop, start ASAP on page open ----------
  // Uses the real clip at public/win-sound.mp3 (loops forever). Most mobile
  // browsers block audio autoplay until a user gesture, so we try to play
  // immediately and, if blocked, kick it off on the very first tap/touch.
  // Sound source: pixabay.com (royalty-free).
  const clip = new Audio('win-sound.mp3');
  clip.loop = true;
  clip.preload = 'auto';
  clip.volume = 0.9;

  let started = false;
  function startAudio() {
    if (started) return;
    clip.currentTime = 0;
    const p = clip.play();
    if (p && p.then) {
      p.then(() => { started = true; })
       .catch(() => { /* blocked — wait for a user gesture below */ });
    } else {
      started = true;
    }
  }

  // Attempt immediate autoplay on load.
  startAudio();
  // Fallbacks: first interaction of any kind starts (and loops) the quacks.
  ['touchstart', 'click', 'pointerdown', 'keydown'].forEach(function (ev) {
    addEventListener(ev, startAudio, { once: false });
  });
  // If the tab was backgrounded during load, try again when it becomes visible.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) startAudio();
  });

  // ---------- Tap-to-celebrate overlay ----------
  // Tapping it counts as the user gesture that unblocks audio, then fades out.
  const prompt = document.getElementById('volume-prompt');
  if (prompt) {
    function dismissPrompt() {
      startAudio();
      prompt.style.transition = 'opacity 0.4s ease';
      prompt.style.opacity = '0';
      setTimeout(function () { prompt.style.display = 'none'; }, 400);
    }
    prompt.addEventListener('click', dismissPrompt, { once: true });
    prompt.addEventListener('touchstart', dismissPrompt, { once: true });
  }
})();
</script>
</body>
</html>
